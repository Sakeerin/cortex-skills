name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python with ruff
        run: |
          ruff check . \
            --select E,F,W \
            --ignore E501 \
            --exclude .git,__pycache__,.pytest_cache,_templates

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts with shellcheck
        run: |
          shellcheck install.sh
          shellcheck sync-git/scripts/sync.sh
          find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck --severity=warning

  validate-skills:
    name: Validate skill structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install pytest

      - name: Validate all skills
        run: |
          python3 skill-creator/scripts/skill_creator.py list
          for skill in */SKILL.md; do
            skill="${skill%/SKILL.md}"
            echo "Validating $skill..."
            python3 skill-creator/scripts/skill_creator.py validate "$skill"
          done
